<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Inventaire Véhicules</title>

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#1C1F22" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Inventaire" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap');
  * { box-sizing: border-box; }
  body { margin: 0; background:#F5F3EE; font-family:'Inter',sans-serif; color:#1C1F22; }
  button { font-family: inherit; cursor: pointer; }
  input, textarea { font-family: inherit; }
  input:focus, textarea:focus, button:focus-visible { outline: 2px solid #C8372E; outline-offset: 2px; }

  header { background:#1C1F22; border-bottom:3px solid #C8372E; position:sticky; top:0; z-index:10; }
  .header-inner { max-width:880px; margin:0 auto; padding:14px 20px; display:flex; align-items:center; justify-content:space-between; }
  .brand-row { display:flex; align-items:center; gap:12px; }
  .brand-mark { width:10px; height:28px; background:#C8372E; }
  .brand-title { font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:22px; letter-spacing:0.04em; color:#F5F3EE; margin:0; line-height:1; }
  .brand-sub { font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:0.12em; color:#8A8F94; margin:4px 0 0; }
  .icon-btn { background:transparent; border:1px solid #3A3F45; color:#F5F3EE; border-radius:4px; padding:8px; display:flex; }

  main { max-width:880px; margin:0 auto; padding:28px 20px 60px; }
  .center-box { display:flex; flex-direction:column; align-items:center; gap:10px; padding:60px 0; }
  .muted { color:#8A8F94; font-size:14px; }
  .err-banner { display:flex; align-items:center; gap:8px; background:#FBEAE8; color:#C8372E; padding:10px 14px; border-radius:4px; font-size:13px; margin-bottom:16px; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:16px; }
  .card { position:relative; text-align:left; background:#fff; border:1px solid #E4E0D6; border-radius:4px; padding:18px 16px 16px; overflow:hidden; width:100%; }
  .card-flag { position:absolute; top:10px; right:-34px; transform:rotate(45deg); width:140px; text-align:center; font-family:'JetBrains Mono',monospace; font-size:9px; font-weight:700; letter-spacing:0.06em; color:#fff; padding:3px 0; }
  .card-body { display:flex; flex-direction:column; gap:4px; padding-right:10px; }
  .card-title { font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:22px; margin:6px 0 0; }
  .card-type { font-family:'JetBrains Mono',monospace; font-size:11px; color:#5B6770; margin:0; text-transform:uppercase; }
  .card-meta { font-size:12px; color:#8A8F94; margin:8px 0 0; }

  .page-title { font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:32px; margin:4px 0 0; }
  .page-subtitle { color:#5B6770; font-size:14px; margin:4px 0 20px; }
  .back-link { display:flex; align-items:center; gap:4px; background:transparent; border:none; color:#5B6770; font-size:13px; padding:0; margin-bottom:14px; }
  .meta-line { font-size:13px; color:#5B6770; margin-bottom:6px; }
  .notes-box { font-size:13px; font-style:italic; color:#5B6770; background:#fff; border:1px solid #E4E0D6; border-radius:4px; padding:10px 12px; margin-bottom:14px; }

  .item-list { list-style:none; padding:0; margin:10px 0 24px; display:flex; flex-direction:column; gap:6px; }
  .group-header { font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:#5B6770; margin:16px 0 4px; }
  .group-header:first-child { margin-top:0; }
  .group-header-form { font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:21px; letter-spacing:0.02em; text-transform:uppercase; color:#1C1F22; margin:24px 0 8px; padding-bottom:5px; border-bottom:2px solid #C8372E; }
  .group-header-form:first-child { margin-top:0; }
  .item-row { display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:4px; }
  .item-name { flex:1; font-size:14px; }
  .item-status { font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700; letter-spacing:0.04em; }

  .empty-box { display:flex; flex-direction:column; align-items:center; gap:8px; background:#fff; border:1px dashed #D8D3C6; border-radius:4px; padding:36px 0; margin-bottom:20px; }

  .btn-primary { display:inline-flex; align-items:center; gap:8px; background:#C8372E; color:#fff; border:none; border-radius:4px; padding:12px 20px; font-size:14px; font-weight:600; margin-top:8px; }
  .btn-primary:disabled { opacity:0.5; }
  .btn-secondary { display:inline-flex; align-items:center; gap:8px; background:#fff; color:#1C1F22; border:1px solid #D8D3C6; border-radius:4px; padding:12px 20px; font-size:14px; font-weight:600; }
  .btn-ghost { background:transparent; border:1px solid #D8D3C6; border-radius:4px; padding:8px 14px; font-size:13px; color:#5B6770; }

  label.field-label { display:block; font-size:12px; font-weight:600; color:#5B6770; margin-top:18px; margin-bottom:6px; }
  input.field, textarea.field { width:100%; border:1px solid #D8D3C6; border-radius:4px; padding:10px 12px; font-size:14px; background:#fff; }
  .field-err { color:#C8372E; font-size:12px; margin-top:4px; }

  .form-row { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid #E4E0D6; flex-wrap:wrap; }
  .form-item-name { font-size:14px; flex:1 1 200px; }
  .toggle-group { display:flex; gap:6px; flex-wrap:wrap; }
  .toggle-btn { border:1.5px solid; border-radius:4px; padding:6px 10px; font-size:12px; font-weight:600; background:#fff; }

  .config-card { background:#fff; border:1px solid #E4E0D6; border-radius:4px; padding:16px; margin-bottom:14px; }
  .config-card-head { display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
  .input-inline { flex:1; min-width:120px; border:1px solid #D8D3C6; border-radius:4px; padding:8px 10px; font-size:14px; font-weight:600; }
  .input-inline-small { flex:1; border:1px solid #D8D3C6; border-radius:4px; padding:7px 10px; font-size:13px; }
  .config-item-row { display:flex; gap:8px; margin-bottom:6px; }
  .danger-btn { background:#FBEAE8; color:#C8372E; border:none; border-radius:4px; padding:0 10px; }
  .add-item-btn { display:inline-flex; align-items:center; gap:6px; background:transparent; border:1px dashed #D8D3C6; border-radius:4px; padding:6px 10px; font-size:12px; color:#5B6770; margin-top:4px; }
  .add-vehicle-btn { display:inline-flex; align-items:center; gap:6px; background:#fff; border:1px dashed #D8D3C6; border-radius:4px; padding:10px 16px; font-size:13px; color:#5B6770; margin-bottom:24px; }
  .config-actions { display:flex; gap:10px; }

  .history-row { display:flex; justify-content:space-between; align-items:center; gap:10px; background:#fff; border:1px solid #E4E0D6; border-radius:4px; padding:12px 14px; margin-bottom:8px; cursor:pointer; }
  .history-row:hover { border-color:#C8372E; }
  .setup-box { background:#fff; border:1px solid #E4E0D6; border-radius:4px; padding:20px; line-height:1.6; font-size:14px; }
  .setup-box code { background:#F5F3EE; padding:2px 6px; border-radius:3px; font-family:'JetBrains Mono',monospace; font-size:12px; }

  .menu-card { display:flex; align-items:center; gap:16px; background:#fff; border:1px solid #E4E0D6; border-radius:4px; padding:22px 20px; text-align:left; width:100%; }
  .menu-card:hover { border-color:#C8372E; }
  .menu-card-icon { font-size:34px; line-height:1; flex-shrink:0; }
  .menu-card-text { display:flex; flex-direction:column; align-items:flex-start; }
  .menu-card-label { font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:21px; }
  .menu-card-sub { font-size:12px; color:#5B6770; margin-top:2px; }

  .contact-list { display:flex; flex-direction:column; gap:10px; }
  .contact-card { background:#fff; border:1px solid #E4E0D6; border-radius:4px; padding:14px 16px; }
  .contact-name { font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:19px; }
  .contact-grade { font-family:'JetBrains Mono',monospace; font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color:#5B6770; margin-top:2px; }
  .contact-details { display:flex; gap:16px; flex-wrap:wrap; margin-top:8px; }
  .contact-link { color:#C8372E; font-size:13px; text-decoration:none; font-weight:600; }
  .contact-notes { font-size:12px; color:#5B6770; font-style:italic; margin-top:6px; }

  .resa-row { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; background:#fff; border:1px solid #E4E0D6; border-radius:4px; padding:12px 14px; margin-bottom:8px; }
  .resa-row.past { opacity:0.5; }
  .resa-dates { font-family:'JetBrains Mono',monospace; font-size:12px; color:#5B6770; }
  .resa-person { font-weight:600; font-size:14px; margin-top:2px; }
  .resa-motif { font-size:12px; color:#5B6770; margin-top:2px; }
  .resa-vehicle-tag { font-family:'JetBrains Mono',monospace; font-size:10px; text-transform:uppercase; letter-spacing:0.05em; color:#C8372E; margin-bottom:4px; }

  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner { animation: spin 0.9s linear infinite; display:block; }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="brand-row">
      <div class="brand-mark"></div>
      <div>
        <h1 class="brand-title" id="brandTitle">CSP PRIVAS</h1>
        <p class="brand-sub" id="brandSub">MENU PRINCIPAL</p>
      </div>
    </div>
    <div style="display:flex; gap:8px; align-items:center;">
      <span id="userBadge" style="display:none; font-family:'JetBrains Mono',monospace; font-size:11px; color:#8A8F94;"></span>
      <button id="homeBtn" class="icon-btn" style="display:none;" title="Menu principal">⌂</button>
      <button id="headerBtn" class="icon-btn" style="display:none;">⚙</button>
      <button id="logoutBtn" class="icon-btn" style="display:none;" title="Déconnexion">⏻</button>
    </div>
  </div>
</header>
<main id="app"></main>

<script>
// =====================================================================
// CONFIGURATION — colle ici l'URL de ton Google Apps Script Web App
// (voir GUIDE-COMPLET.md)
// =====================================================================
const API_URL = "https://script.google.com/macros/s/AKfycbyXJoCpQIRlgbQ2adXKB8-pCXTym-7iXGfeW_r3DkZazMgo3M9NHMcd1vD-m70ldCfN3A/exec";

// ---------------------------------------------------------------------
// State
// ---------------------------------------------------------------------
let state = {
  config: null,
  history: [],
  view: "login", // login | setup | home | dashboard | detail | form | config | historyList | historyDetail | directory | directoryConfig | recap | reservation | reservationVehicle | reservationManage | usersManage
  selectedVehicleId: null,
  selectedEntryId: null,
  loading: false,
  error: null,
  currentUser: null, // { id, username, displayName, isAdmin, canViewDirectory }
  currentCode: "",
  personnel: null,
  recapVehicleId: null,
  recapDefects: null,
  reservations: null,
  reservationVehicles: null,
  users: null,
};

const SESSION_KEY = "csp_privas_session";

function isAdminUser() {
  return !!(state.currentUser && state.currentUser.isAdmin);
}

function canViewDirectoryUser() {
  return !!(state.currentUser && (state.currentUser.isAdmin || state.currentUser.canViewDirectory));
}

const STATUS = {
  ok: { label: "OK", color: "#3A7D5C", bg: "#E7F1EB" },
  manquant: { label: "Manquant", color: "#C8372E", bg: "#FBEAE8" },
  endommage: { label: "Endommagé", color: "#E8A33D", bg: "#FCF1DF" },
};

const GRADES = [
  "Sapeur",
  "Sapeur 1er classe",
  "Caporal",
  "Caporal-chef",
  "Sergent",
  "Sergent-chef",
  "Adjudant",
  "Adjudant-chef",
  "Lieutenant",
  "Capitaine",
  "Commandant",
  "Lieutenant-colonel",
  "Colonel",
  "Autre",
];

// Ordre d'affichage dans l'annuaire (différent de l'ordre du menu déroulant ci-dessus) :
// Autre en premier, puis du grade le plus élevé au plus bas.
const GRADE_DISPLAY_ORDER = [
  "Autre",
  "Colonel",
  "Lieutenant-colonel",
  "Commandant",
  "Capitaine",
  "Lieutenant",
  "Adjudant-chef",
  "Adjudant",
  "Sergent-chef",
  "Sergent",
  "Caporal-chef",
  "Caporal",
  "Sapeur 1er classe",
  "Sapeur",
];

const uid = () => Math.random().toString(36).slice(2, 9);

// "Jean-Marc" -> "jean-marc", "Élodie" -> "elodie" (accents retirés, minuscules, espaces -> points)
function normalizeUsernamePart(str) {
  return (str || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase()
    .trim()
    .replace(/\s+/g, "-")
    .replace(/[^a-z0-9-]/g, "");
}

// Ensures older configs (free-text "group" field) still work: migrates any
// legacy text group into a real location entry the first time it's loaded.
function normalizeConfig(cfg) {
  cfg.vehicles.forEach((v) => {
    if (!v.groups) v.groups = [];
    if (typeof v.hidden !== "boolean") v.hidden = false;
    if (typeof v.checkFrequencyDays !== "number" || !v.checkFrequencyDays) v.checkFrequencyDays = null;
    v.items.forEach((it) => {
      if (!it.groupId && it.group && it.group.trim()) {
        const name = it.group.trim();
        let g = v.groups.find((g) => g.name === name);
        if (!g) {
          g = { id: uid(), name };
          v.groups.push(g);
        }
        it.groupId = g.id;
      }
      delete it.group;
      if (!it.groupId) it.groupId = null;
    });
  });
  return cfg;
}

// Items in vehicle-defined location order; unassigned items appear first, unlabeled.
function groupItemsByLocation(vehicle) {
  const groups = vehicle.groups || [];
  const items = vehicle.items || [];
  const result = [];
  const ungrouped = items.filter((it) => !it.groupId || !groups.find((g) => g.id === it.groupId));
  if (ungrouped.length) result.push({ name: null, items: ungrouped });
  groups.forEach((g) => {
    const gItems = items.filter((it) => it.groupId === g.id);
    if (gItems.length) result.push({ name: g.name, items: gItems });
  });
  return result;
}

// ---------------------------------------------------------------------
// API helpers
// ---------------------------------------------------------------------
async function apiGet(action, params = {}) {
  const q = new URLSearchParams({ action, ...params });
  const res = await fetch(`${API_URL}?${q.toString()}`);
  if (!res.ok) throw new Error("Erreur réseau");
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}

// Pour les envois volumineux et tout ce qui nécessite des identifiants :
// le corps de la requête n'a pas la limite de longueur d'une URL, et les
// identifiants n'apparaissent pas dans l'URL/les journaux.
async function apiPost(action, payload = {}) {
  const res = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify({ action, ...payload }),
  });
  if (!res.ok) throw new Error("Erreur réseau");
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  return data;
}

function creds() {
  return { username: state.currentUser ? state.currentUser.username : "", code: state.currentCode };
}

async function loadAll() {
  state.loading = true;
  state.error = null;
  render();
  try {
    const data = await apiGet("getData");
    state.config = normalizeConfig(data.config);
    state.history = data.history || [];
  } catch (e) {
    state.error = "Impossible de charger les données. Vérifie la configuration (voir GUIDE-COMPLET.md).";
  } finally {
    state.loading = false;
    render();
  }
}

// ---------------------------------------------------------------------
// Authentification
// ---------------------------------------------------------------------
async function attemptLogin(username, code) {
  const data = await apiPost("login", { username, code });
  return data.ok ? data.user : null;
}

function saveSession(username, code) {
  try {
    localStorage.setItem(SESSION_KEY, JSON.stringify({ username, code }));
  } catch (e) {}
}

function clearSession() {
  try {
    localStorage.removeItem(SESSION_KEY);
  } catch (e) {}
}

function readSession() {
  try {
    const raw = localStorage.getItem(SESSION_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}

function requireAdminOrAlert() {
  if (isAdminUser()) return true;
  alert("Cette action est réservée aux administrateurs.");
  return false;
}

function requireDirectoryOrAlert() {
  if (canViewDirectoryUser()) return true;
  alert("Tu n'as pas accès à l'annuaire. Contacte un administrateur.");
  return false;
}

async function ensurePersonnelLoaded() {
  if (state.personnel !== null) return;
  try {
    const data = await apiPost("getPersonnel", creds());
    state.personnel = data.contacts || [];
  } catch (e) {
    state.error = "Impossible de charger l'annuaire : " + e.message;
    state.personnel = [];
  }
}

async function savePersonnelRemote(contacts) {
  await apiPost("savePersonnel", { contacts, ...creds() });
  state.personnel = contacts;
}

async function ensureReservationsLoaded() {
  if (state.reservations !== null && state.reservationVehicles !== null) return;
  try {
    const data = await apiGet("getReservationData");
    state.reservationVehicles = data.vehicles || [];
    state.reservations = data.reservations || [];
  } catch (e) {
    state.error = "Impossible de charger les réservations : " + e.message;
    state.reservationVehicles = [];
    state.reservations = [];
  }
}

async function saveReservationVehiclesRemote(vehicles) {
  await apiPost("saveReservationVehicles", { vehicles, ...creds() });
  state.reservationVehicles = vehicles;
}

async function addReservationRemote(reservation) {
  const withCreator = { ...reservation, createdBy: state.currentUser ? state.currentUser.username : "" };
  const res = await apiPost("addReservation", { reservation: withCreator });
  state.reservations.push({ ...withCreator, id: res.id });
}

async function deleteReservationRemote(id) {
  await apiPost("deleteReservation", { id, ...creds() });
  state.reservations = state.reservations.filter((r) => r.id !== id);
}

async function saveConfigRemote(cfg) {
  await apiPost("saveConfig", { config: cfg, ...creds() });
  state.config = cfg;
}

async function submitInventoryRemote(record) {
  const res = await apiPost("submitInventory", { record });
  state.history.push({ ...record, id: res.id });
}

async function deleteEntryRemote(id) {
  await apiPost("deleteEntry", { id, ...creds() });
  state.history = state.history.filter((h) => h.id !== id);
}

async function ensureUsersLoaded() {
  if (state.users !== null) return;
  try {
    const data = await apiPost("getUsers", creds());
    state.users = data.users || [];
  } catch (e) {
    state.error = "Impossible de charger les utilisateurs : " + e.message;
    state.users = [];
  }
}

async function saveUsersRemote(users) {
  await apiPost("saveUsers", { users, ...creds() });
  state.users = users.map(({ newCode, ...rest }) => rest);
}

function latestFor(vehicleId) {
  const entries = state.history.filter((h) => h.vehicleId === vehicleId);
  if (!entries.length) return null;
  return entries.slice().sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp))[0];
}

function isOverdue(vehicle, record) {
  if (!vehicle.checkFrequencyDays || !record) return false;
  const days = (Date.now() - new Date(record.timestamp).getTime()) / (1000 * 60 * 60 * 24);
  return days > vehicle.checkFrequencyDays;
}

function historyFor(vehicleId) {
  return state.history
    .filter((h) => h.vehicleId === vehicleId)
    .slice()
    .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
}

function renderRecap() {
  const v = state.config.vehicles.find((x) => x.id === state.recapVehicleId);
  if (!v) return "";
  const rows = (state.recapDefects || [])
    .map((d) => {
      const meta = STATUS[d.status];
      return `<li class="item-row" style="background:${meta.bg}">
        <span style="color:${meta.color}">●</span>
        <span class="item-name">${escapeHtml(d.name)}${d.groupName ? ` <span style="color:#8A8F94;">(${escapeHtml(d.groupName)})</span>` : ""}</span>
        <span class="item-status" style="color:${meta.color}">${meta.label}</span>
      </li>`;
    })
    .join("");

  return `
    <div class="err-banner" style="background:#FBEAE8; color:#C8372E; align-items:flex-start; flex-direction:column; gap:4px;">
      <strong style="font-family:'Barlow Condensed',sans-serif; font-weight:800; font-size:16px; letter-spacing:0.02em;">⚠ Merci de reporter ces éléments sur le tableau</strong>
      <span style="font-size:13px;">${(state.recapDefects || []).length} élément(s) à signaler sur ${escapeHtml(v.name)} :</span>
    </div>
    <ul class="item-list">${rows}</ul>
    <button class="btn-primary" data-action="detail" data-vehicle="${v.id}">J'ai bien noté →</button>`;
}

function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleString("fr-FR", { day: "2-digit", month: "2-digit", year: "2-digit", hour: "2-digit", minute: "2-digit" });
}

function goto(view, vehicleId = null, entryId = null) {
  state.view = view;
  state.selectedVehicleId = vehicleId;
  state.selectedEntryId = entryId;
  window.scrollTo(0, 0);
  render();
}

// ---------------------------------------------------------------------
// Header button behavior
// ---------------------------------------------------------------------
function sectionOf(view) {
  if (view === "login" || view === "home") return view;
  if (["directory", "directoryConfig"].includes(view)) return "directory";
  if (["reservation", "reservationVehicle", "reservationManage"].includes(view)) return "reservation";
  return "inventory";
}

function updateHeader() {
  const section = sectionOf(state.view);
  const homeBtn = document.getElementById("homeBtn");
  const headerBtn = document.getElementById("headerBtn");
  const logoutBtn = document.getElementById("logoutBtn");
  const userBadge = document.getElementById("userBadge");
  const brandTitle = document.getElementById("brandTitle");
  const brandSub = document.getElementById("brandSub");

  const loggedIn = !!state.currentUser;
  homeBtn.style.display = loggedIn && section !== "home" ? "flex" : "none";
  logoutBtn.style.display = loggedIn ? "flex" : "none";
  userBadge.style.display = loggedIn ? "inline" : "none";
  userBadge.textContent = loggedIn ? state.currentUser.displayName : "";
  headerBtn.style.display = loggedIn && ["inventory", "directory", "reservation"].includes(section) ? "flex" : "none";

  if (section === "inventory") {
    brandTitle.textContent = "INVENTAIRE VÉHICULES";
    brandSub.textContent = "POSTE · CONTRÔLE MATÉRIEL";
  } else if (section === "directory") {
    brandTitle.textContent = "ANNUAIRE DU PERSONNEL";
    brandSub.textContent = "CSP · CONTACTS";
  } else if (section === "reservation") {
    brandTitle.textContent = "RÉSERVATION VÉHICULES";
    brandSub.textContent = "CSP · PLANNING";
  } else {
    brandTitle.textContent = "CSP PRIVAS";
    brandSub.textContent = "MENU PRINCIPAL";
  }
}

document.getElementById("homeBtn").addEventListener("click", () => goto("home"));

document.getElementById("logoutBtn").addEventListener("click", () => {
  if (!confirm("Se déconnecter ?")) return;
  clearSession();
  state.currentUser = null;
  state.currentCode = "";
  state.config = null;
  state.history = [];
  state.personnel = null;
  state.reservations = null;
  state.reservationVehicles = null;
  state.users = null;
  configDraft = null;
  configDirty = false;
  configCollapsed = null;
  personnelDraft = null;
  personnelDirty = false;
  reservationVehiclesDraft = null;
  reservationVehiclesDirty = false;
  formDraft = { checkedBy: "", results: {}, notes: "", step: 0, touched: false, saving: false };
  reservationDraft = { personName: "", startDate: "", startTime: "", endDate: "", endTime: "", motif: "", touched: false, saving: false };
  state._formVehicleId = null;
  state._resaVehicleId = null;
  goto("login");
});

document.getElementById("headerBtn").addEventListener("click", async () => {
  const section = sectionOf(state.view);
  if (section === "inventory") {
    if (state.view === "config") {
      goto("dashboard");
      return;
    }
    if (!requireAdminOrAlert()) return;
    goto("config");
  } else if (section === "directory") {
    if (state.view === "directoryConfig") {
      goto("directory");
      return;
    }
    if (!requireAdminOrAlert()) return;
    if (state.personnel === null || state.users === null) {
      state.loading = true;
      render();
      await ensurePersonnelLoaded();
      await ensureUsersLoaded();
      state.loading = false;
    }
    goto("directoryConfig");
  } else if (section === "reservation") {
    if (state.view === "reservationManage") {
      goto("reservation");
      return;
    }
    if (!requireAdminOrAlert()) return;
    if (state.reservations === null || state.reservationVehicles === null) {
      state.loading = true;
      render();
      await ensureReservationsLoaded();
      state.loading = false;
    }
    goto("reservationManage");
  }
});

// ---------------------------------------------------------------------
// Render
// ---------------------------------------------------------------------
function render() {
  const app = document.getElementById("app");
  updateHeader();

  if (!API_URL || API_URL.indexOf("COLLE_ICI") === 0) {
    app.innerHTML = `
      <div class="setup-box">
        <h2 class="page-title" style="font-size:24px;">Configuration requise</h2>
        <p>Cette application n'est pas encore connectée à sa base de données.</p>
        <p>Ouvre le fichier <code>index.html</code>, trouve la ligne :</p>
        <p><code>const API_URL = "COLLE_ICI_TON_URL_GOOGLE_APPS_SCRIPT";</code></p>
        <p>Et remplace-la par l'URL de ton Google Apps Script Web App (voir <code>GUIDE-COMPLET.md</code>).</p>
      </div>`;
    return;
  }

  if (state.loading) {
    app.innerHTML = `<div class="center-box"><svg class="spinner" width="28" height="28" viewBox="0 0 28 28"><circle cx="14" cy="14" r="11" fill="none" stroke="#E4E0D6" stroke-width="3.5"/><circle cx="14" cy="14" r="11" fill="none" stroke="#C8372E" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="52" stroke-dashoffset="35"/></svg><p class="muted">Chargement…</p></div>`;
    return;
  }

  let html = "";
  if (state.error) {
    html += `<div class="err-banner">⚠ ${state.error}</div>`;
  }

  if (state.view === "login") {
    html += renderLogin();
    app.innerHTML = html;
    attachHandlers();
    attachLoginHandlers();
    return;
  }

  if (state.view === "setup") {
    html += renderSetup();
    app.innerHTML = html;
    attachHandlers();
    attachSetupHandlers();
    return;
  }

  if (!state.currentUser) {
    goto("login");
    return;
  }

  if (state.view === "home") {
    html += renderHome();
    app.innerHTML = html;
    attachHandlers();
    return;
  }

  if (!state.config) {
    app.innerHTML = html;
    return;
  }

  if (state.view === "dashboard") html += renderDashboard();
  else if (state.view === "detail") html += renderDetail();
  else if (state.view === "form") html += renderForm();
  else if (state.view === "config") html += renderConfig();
  else if (state.view === "historyList") html += renderHistoryList();
  else if (state.view === "historyDetail") html += renderHistoryDetail();
  else if (state.view === "directory") html += renderDirectoryList();
  else if (state.view === "directoryConfig") html += renderDirectoryConfig();
  else if (state.view === "recap") html += renderRecap();
  else if (state.view === "reservation") html += renderReservationHome();
  else if (state.view === "reservationVehicle") html += renderReservationVehicle();
  else if (state.view === "reservationManage") html += renderReservationManage();

  app.innerHTML = html;
  attachHandlers();
}

// Connexion

let loginDraft = { username: "", code: "", touched: false, submitting: false, error: "" };

function renderLogin() {
  const d = loginDraft;
  return `
    <div style="max-width:340px; margin:40px auto 0;">
      <h2 class="page-title" style="font-size:26px; text-align:center;">Connexion</h2>
      <p class="page-subtitle" style="text-align:center;">CSP Privas</p>

      <label class="field-label">Identifiant</label>
      <input class="field" id="loginUsername" placeholder="prenom.nom" value="${escapeHtml(d.username)}" autocapitalize="none" autocomplete="username" />

      <label class="field-label">Code à 4 chiffres</label>
      <input class="field" id="loginCode" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off"
        style="letter-spacing:0.3em; text-align:center; font-family:'JetBrains Mono',monospace; font-size:22px;" value="${escapeHtml(d.code)}" />

      ${d.touched && d.error ? `<p class="field-err">${escapeHtml(d.error)}</p>` : ""}

      <button class="btn-primary" id="loginSubmitBtn" style="width:100%; justify-content:center; margin-top:16px;" ${d.submitting ? "disabled" : ""}>
        ${d.submitting ? "Connexion…" : "Se connecter"}
      </button>
    </div>`;
}

function attachLoginHandlers() {
  const userEl = document.getElementById("loginUsername");
  const codeEl = document.getElementById("loginCode");
  if (userEl) userEl.addEventListener("input", (e) => { loginDraft.username = e.target.value; });
  if (codeEl) codeEl.addEventListener("input", (e) => { loginDraft.code = e.target.value; });

  const submit = async () => {
    const d = loginDraft;
    d.touched = true;
    if (!d.username.trim() || !/^\d{4}$/.test(d.code)) {
      d.error = "Renseigne ton identifiant et ton code à 4 chiffres.";
      render();
      attachLoginHandlers();
      return;
    }
    d.submitting = true;
    render();
    attachLoginHandlers();
    try {
      const user = await attemptLogin(d.username.trim(), d.code);
      if (!user) {
        d.error = "Identifiant ou code incorrect.";
        d.submitting = false;
        render();
        attachLoginHandlers();
        return;
      }
      const usedUsername = d.username.trim();
      const usedCode = d.code;
      loginDraft = { username: "", code: "", touched: false, submitting: false, error: "" };

      if (user.mustChangeCode) {
        state._setupUsername = usedUsername;
        state._setupOldSecret = usedCode;
        state._setupUser = user;
        goto("setup");
        return;
      }

      state.currentUser = user;
      state.currentCode = usedCode;
      saveSession(usedUsername, usedCode);
      goto("home");
      await loadAll();
    } catch (e) {
      d.error = "Connexion impossible pour le moment : " + e.message;
      d.submitting = false;
      render();
      attachLoginHandlers();
    }
  };

  const btn = document.getElementById("loginSubmitBtn");
  if (btn) btn.addEventListener("click", submit);
  if (codeEl) codeEl.addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
}

// ---------------------------------------------------------------------
// Première connexion : choix d'un code personnel à 4 chiffres
// ---------------------------------------------------------------------
let setupDraft = { newPin: "", confirmPin: "", touched: false, submitting: false, error: "" };

function renderSetup() {
  const d = setupDraft;
  const name = (state._setupUser && state._setupUser.displayName) || "";
  return `
    <div style="max-width:340px; margin:30px auto 0;">
      <h2 class="page-title" style="font-size:24px; text-align:center;">Première connexion</h2>
      <p class="page-subtitle" style="text-align:center;">${escapeHtml(name)} — choisis un code à 4 chiffres</p>

      <label class="field-label">Code à 4 chiffres</label>
      <input class="field" id="setupNewPin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4"
        style="letter-spacing:0.3em; text-align:center; font-family:'JetBrains Mono',monospace; font-size:20px;" value="${escapeHtml(d.newPin)}" />

      <label class="field-label">Confirmer le code</label>
      <input class="field" id="setupConfirmPin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4"
        style="letter-spacing:0.3em; text-align:center; font-family:'JetBrains Mono',monospace; font-size:20px;" value="${escapeHtml(d.confirmPin)}" />
      <p class="muted" style="font-size:11px; margin-top:4px;">Ce sera ton code de connexion à partir de maintenant.</p>

      ${d.touched && d.error ? `<p class="field-err">${escapeHtml(d.error)}</p>` : ""}

      <button class="btn-primary" id="setupSubmitBtn" style="width:100%; justify-content:center; margin-top:16px;" ${d.submitting ? "disabled" : ""}>
        ${d.submitting ? "Enregistrement…" : "Valider"}
      </button>
    </div>`;
}

function attachSetupHandlers() {
  const fields = [
    ["setupNewPin", "newPin"],
    ["setupConfirmPin", "confirmPin"],
  ];
  fields.forEach(([id, field]) => {
    const el = document.getElementById(id);
    if (el) el.addEventListener("input", (e) => { setupDraft[field] = e.target.value; });
  });

  const submit = async () => {
    const d = setupDraft;
    d.touched = true;

    if (!/^\d{4}$/.test(d.newPin)) {
      d.error = "Le code doit contenir exactement 4 chiffres.";
      render();
      attachSetupHandlers();
      return;
    }
    if (d.newPin === state._setupOldSecret) {
      d.error = "Choisis un code différent de ton code actuel.";
      render();
      attachSetupHandlers();
      return;
    }
    if (d.newPin !== d.confirmPin) {
      d.error = "Les deux codes ne correspondent pas.";
      render();
      attachSetupHandlers();
      return;
    }

    d.submitting = true;
    render();
    attachSetupHandlers();
    try {
      const data = await apiPost("completeSetup", {
        username: state._setupUsername,
        oldCode: state._setupOldSecret,
        newCode: d.newPin,
      });
      state.currentUser = data.user;
      state.currentCode = d.newPin; // c'est désormais le seul et unique code du compte
      saveSession(state._setupUsername, d.newPin);
      state._setupUsername = null;
      state._setupOldSecret = null;
      state._setupUser = null;
      setupDraft = { newPin: "", confirmPin: "", touched: false, submitting: false, error: "" };
      goto("home");
      await loadAll();
    } catch (e) {
      d.error = "Échec : " + e.message;
      d.submitting = false;
      render();
      attachSetupHandlers();
    }
  };

  const btn = document.getElementById("setupSubmitBtn");
  if (btn) btn.addEventListener("click", submit);
}

function renderDashboard() {
  const cards = state.config.vehicles
    .filter((v) => !v.hidden)
    .map((v) => {
      const rec = latestFor(v.id);
      const problems = rec ? Object.values(rec.results).filter((s) => s !== "ok").length : null;
      const overdue = isOverdue(v, rec);
      let flagColor, flagLabel;
      if (rec && problems > 0) {
        flagColor = "#C8372E";
        flagLabel = `${problems} À SIGNALER`;
      } else if (!rec) {
        flagColor = "#8A8F94";
        flagLabel = "NON VÉRIFIÉ";
      } else if (overdue) {
        flagColor = "#E8A33D";
        flagLabel = "À VÉRIFIER";
      } else {
        flagColor = "#3A7D5C";
        flagLabel = "COMPLET";
      }
      return `
        <button class="card" data-action="detail" data-vehicle="${v.id}">
          <div class="card-flag" style="background:${flagColor}">${flagLabel}</div>
          <div class="card-body">
            <h2 class="card-title">${escapeHtml(v.name)}</h2>
            <p class="card-type">${escapeHtml(v.type)}</p>
            <p class="card-meta">${rec ? `Vérifié par ${escapeHtml(rec.checkedBy)} · ${formatDate(rec.timestamp)}` : "Jamais vérifié"}</p>
          </div>
        </button>`;
    })
    .join("");
  return `<div class="grid">${cards}</div>`;
}

// ---------------------------------------------------------------------
// Detail
// ---------------------------------------------------------------------
function renderDetail() {
  const v = state.config.vehicles.find((x) => x.id === state.selectedVehicleId);
  if (!v) return "";
  if (state._detailVehicleId !== v.id) {
    state.detailShowAll = false;
    state._detailVehicleId = v.id;
  }
  const rec = latestFor(v.id);
  const hist = historyFor(v.id);
  const overdueBanner = isOverdue(v, rec)
    ? `<div class="err-banner" style="background:#FCF1DF; color:#E8A33D;">⏰ À vérifier — dernier contrôle il y a plus de ${v.checkFrequencyDays} jour(s).</div>`
    : "";

  let body;
  if (rec) {
    const defectCount = Object.values(rec.results).filter((s) => s !== "ok").length;
    const showAll = state.detailShowAll;
    const groups = groupItemsByLocation(v);
    const rows = groups
      .map((g) => {
        const visibleItems = showAll ? g.items : g.items.filter((it) => (rec.results[it.id] || "ok") !== "ok");
        if (!visibleItems.length) return "";
        const header = g.name ? `<div class="group-header">${escapeHtml(g.name)}</div>` : "";
        const itemRows = visibleItems
          .map((it) => {
            const s = rec.results[it.id] || "ok";
            const meta = STATUS[s];
            return `<li class="item-row" style="background:${meta.bg}">
              <span style="color:${meta.color}">●</span>
              <span class="item-name">${escapeHtml(it.name)}</span>
              <span class="item-status" style="color:${meta.color}">${meta.label}</span>
            </li>`;
          })
          .join("");
        return header + itemRows;
      })
      .join("");

    const toggleBtn = `<button class="btn-ghost" data-action="toggleDetailShowAll" style="margin-bottom:10px;">${showAll ? "Ne voir que les défauts" : "Voir tout l'équipement"}</button>`;

    const listOrSuccess =
      !showAll && defectCount === 0
        ? `<div class="empty-box"><p class="muted">✅ Rien à signaler — tout est en ordre.</p></div>`
        : `<ul class="item-list">${rows}</ul>`;

    body = `
      <p class="meta-line">Vérifié par <strong>${escapeHtml(rec.checkedBy)}</strong> le ${formatDate(rec.timestamp)}</p>
      ${rec.notes ? `<p class="notes-box">« ${escapeHtml(rec.notes)} »</p>` : ""}
      ${toggleBtn}
      ${listOrSuccess}`;
  } else {
    body = `<div class="empty-box"><p class="muted">Aucun inventaire enregistré pour ce véhicule.</p></div>`;
  }

  return `
    <button class="back-link" data-action="dashboard">← Tableau de bord</button>
    <h2 class="page-title">${escapeHtml(v.name)}</h2>
    <p class="page-subtitle">${escapeHtml(v.type)}</p>
    ${overdueBanner}
    ${body}
    <div style="display:flex; gap:10px; flex-wrap:wrap;">
      <button class="btn-primary" data-action="form" data-vehicle="${v.id}">${rec ? "Refaire l'inventaire" : "Faire l'inventaire"}</button>
      ${hist.length ? `<button class="btn-secondary" data-action="historyList" data-vehicle="${v.id}">Historique (${hist.length})</button>` : ""}
    </div>`;
}

function renderHistoryList() {
  const v = state.config.vehicles.find((x) => x.id === state.selectedVehicleId);
  const hist = historyFor(v.id);
  const rows = hist
    .map((h) => {
      const problems = Object.values(h.results).filter((s) => s !== "ok").length;
      return `<div class="history-row" data-action="historyDetail" data-vehicle="${v.id}" data-entry="${h.id}">
        <span>${formatDate(h.timestamp)} — ${escapeHtml(h.checkedBy)}</span>
        <span style="color:${problems ? "#C8372E" : "#3A7D5C"}; font-family:'JetBrains Mono',monospace; font-size:11px;">${problems ? problems + " à signaler" : "complet"}</span>
      </div>`;
    })
    .join("");
  return `
    <button class="back-link" data-action="detail" data-vehicle="${v.id}">← ${escapeHtml(v.name)}</button>
    <h2 class="page-title">Historique</h2>
    <p class="page-subtitle">${escapeHtml(v.name)} — ${hist.length} inventaire(s)</p>
    ${rows}`;
}

function renderHistoryDetail() {
  const v = state.config.vehicles.find((x) => x.id === state.selectedVehicleId);
  const entry = state.history.find((h) => h.id === state.selectedEntryId);
  if (!entry) return "";
  const groups = groupItemsByLocation(v);
  const rows = groups
    .map((g) => {
      const header = g.name ? `<div class="group-header">${escapeHtml(g.name)}</div>` : "";
      const itemRows = g.items
        .map((it) => {
          const s = entry.results[it.id] || "ok";
          const meta = STATUS[s];
          return `<li class="item-row" style="background:${meta.bg}">
            <span style="color:${meta.color}">●</span>
            <span class="item-name">${escapeHtml(it.name)}</span>
            <span class="item-status" style="color:${meta.color}">${meta.label}</span>
          </li>`;
        })
        .join("");
      return header + itemRows;
    })
    .join("");
  return `
    <button class="back-link" data-action="historyList" data-vehicle="${v.id}">← Historique</button>
    <h2 class="page-title">${escapeHtml(v.name)}</h2>
    <p class="meta-line">Vérifié par <strong>${escapeHtml(entry.checkedBy)}</strong> le ${formatDate(entry.timestamp)}</p>
    ${entry.notes ? `<p class="notes-box">« ${escapeHtml(entry.notes)} »</p>` : ""}
    <ul class="item-list">${rows}</ul>
    ${isAdminUser() ? `<button class="btn-secondary" data-action="deleteEntry" data-entry="${entry.id}" data-vehicle="${v.id}" style="color:#C8372E; border-color:#C8372E;">Supprimer cette entrée</button>` : ""}`;
}

// ---------------------------------------------------------------------
// Form
// ---------------------------------------------------------------------
let formDraft = { checkedBy: (state.currentUser && state.currentUser.displayName) || "", results: {}, notes: "", step: 0, touched: false, saving: false };

function renderForm() {
  const v = state.config.vehicles.find((x) => x.id === state.selectedVehicleId);
  if (!v) return "";
  if (state._formVehicleId !== v.id) {
    formDraft = { checkedBy: (state.currentUser && state.currentUser.displayName) || "", results: {}, notes: "", step: 0, touched: false, saving: false };
    state._formVehicleId = v.id;
  }

  const groups = groupItemsByLocation(v);
  const step = Math.min(formDraft.step, groups.length - 1);
  const current = groups[step];
  const isLast = step === groups.length - 1;
  const stepAnswered = current.items.every((it) => formDraft.results[it.id]);
  const nameOk = formDraft.checkedBy.trim().length > 0;

  const nameField =
    step === 0
      ? `
    <label class="field-label">Contrôlé par</label>
    <p style="font-size:14px; font-weight:600; margin:0 0 8px;">${escapeHtml(formDraft.checkedBy) || "—"}</p>`
      : "";

  const itemsHtml = current.items
    .map((it) => {
      const btns = Object.entries(STATUS)
        .map(([key, meta]) => {
          const active = formDraft.results[it.id] === key;
          return `<button class="toggle-btn" data-action="setStatus" data-item="${it.id}" data-status="${key}"
            style="border-color:${meta.color}; background:${active ? meta.color : "#fff"}; color:${active ? "#fff" : meta.color};">
            ${meta.label}</button>`;
        })
        .join("");
      return `<div class="form-row"><span class="form-item-name">${escapeHtml(it.name)}</span><div class="toggle-group">${btns}</div></div>`;
    })
    .join("");

  const notesField = isLast
    ? `
    <label class="field-label">Remarques générales (optionnel)</label>
    <textarea class="field" id="notesInput" rows="3" placeholder="Détails utiles : emplacement, état, action à prévoir…">${escapeHtml(formDraft.notes)}</textarea>`
    : "";

  const backBtn =
    step > 0
      ? `<button class="btn-secondary" data-action="prevStep">← Lieu précédent</button>`
      : "";

  return `
    <button class="back-link" data-action="detail" data-vehicle="${v.id}">← Annuler</button>
    <h2 class="page-title">${escapeHtml(v.name)}</h2>
    <p class="page-subtitle" style="font-family:'JetBrains Mono',monospace; font-size:12px; letter-spacing:0.06em;">LIEU ${step + 1} / ${groups.length}</p>

    ${nameField}

    <div class="group-header-form">${current.name ? escapeHtml(current.name) : "Équipements divers"}</div>
    ${itemsHtml}
    ${formDraft.touched && !stepAnswered ? `<p class="field-err">Renseigne le statut de chaque équipement de ce lieu.</p>` : ""}

    ${notesField}

    <div style="display:flex; gap:10px; margin-top:16px; flex-wrap:wrap;">

function renderDirectoryList() {
  const gradeRank = (g) => {
    const i = GRADE_DISPLAY_ORDER.indexOf(g);
    return i === -1 ? GRADE_DISPLAY_ORDER.length : i; // pas de grade renseigné -> à la fin
  };
  const contacts = (state.personnel || [])
    .slice()
    .sort((a, b) => {
      const r = gradeRank(a.grade) - gradeRank(b.grade);
      if (r !== 0) return r;
      const byNom = (a.nom || "").localeCompare(b.nom || "", "fr");
      if (byNom !== 0) return byNom;
      return (a.prenom || "").localeCompare(b.prenom || "", "fr");
    });

  if (!contacts.length) {
    return `<div class="empty-box"><p class="muted">Aucun contact enregistré pour le moment.</p></div>`;
  }

  let lastGrade = undefined;
  const rows = contacts
    .map((c) => {
      const label = c.grade || "Sans grade renseigné";
      const header = label !== lastGrade ? `<div class="group-header">${escapeHtml(label)}</div>` : "";
      lastGrade = label;
      return (
        header +
        `
    <div class="contact-card">
      <div class="contact-name">${escapeHtml(c.prenom || "")} ${escapeHtml(c.nom || "")}</div>
      <div class="contact-details">
        ${c.telephone ? `<a href="tel:${escapeHtml(c.telephone)}" class="contact-link">📞 ${escapeHtml(c.telephone)}</a>` : ""}
        ${c.email ? `<a href="mailto:${escapeHtml(c.email)}" class="contact-link">✉ ${escapeHtml(c.email)}</a>` : ""}
      </div>
      ${c.notes ? `<div class="contact-notes">${escapeHtml(c.notes)}</div>` : ""}
    </div>`
      );
    })
    .join("");

  return `<div class="contact-list">${rows}</div>`;
}

function reservationsFor(vehicleId) {
  return (state.reservations || [])
    .filter((r) => r.vehicleId === vehicleId)
    .slice()
    .sort((a, b) => new Date(a.start) - new Date(b.start));
}

// Deux créneaux se chevauchent si l'un commence avant que l'autre finisse, dans les deux sens.
function findOverlap(vehicleId, startISO, endISO, excludeId = null) {
  const start = new Date(startISO).getTime();
  const end = new Date(endISO).getTime();
  return (
    (state.reservations || []).find((r) => {
      if (r.vehicleId !== vehicleId || r.id === excludeId) return false;
      const rStart = new Date(r.start).getTime();
      const rEnd = new Date(r.end).getTime();
      return start < rEnd && end > rStart;
    }) || null
  );
}

function nextReservation(vehicleId) {
  const now = Date.now();
  return reservationsFor(vehicleId).find((r) => new Date(r.end).getTime() >= now) || null;
}

function formatResaDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleString("fr-FR", { day: "2-digit", month: "2-digit", year: "2-digit", hour: "2-digit", minute: "2-digit" });
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// ---------------------------------------------------------------------
// Event delegation
// ---------------------------------------------------------------------
function attachHandlers() {
  const app = document.getElementById("app");

  app.querySelectorAll("[data-action]").forEach((el) => {
    el.addEventListener("click", async (e) => {
      const action = el.dataset.action;
      const vehicleId = el.dataset.vehicle;
      const itemId = el.dataset.item;
      const entryId = el.dataset.entry;
      const contactId = el.dataset.contact;

      if (action === "home") goto("home");
      else if (action === "goDashboard") goto("dashboard");
      else if (action === "goDirectory" || action === "directory") {
        if (!requireDirectoryOrAlert()) return;
        if (state.personnel === null) {
          state.loading = true;
          render();
          await ensurePersonnelLoaded();
          state.loading = false;
        }
        goto("directory");
      }
      else if (action === "addContact") {
        personnelDraft.push({
          id: uid(),
          prenom: "",
          nom: "",
          grade: "",
          telephone: "",
          email: "",
          notes: "",
          userId: null,
          username: "",
          isAdmin: false,
          canViewDirectory: false,
        });
        personnelDirty = true;
        render();
      }
      else if (action === "removeContact") {
        const contact = personnelDraft.find((c) => c.id === contactId);
        const hasLikelyAccount =
          contact && (contact.userId || (contact.prenom && contact.nom));
        if (hasLikelyAccount) {
          if (!confirm("Le compte de connexion associé à ce contact (s'il existe) sera aussi supprimé à l'enregistrement. Continuer ?")) return;
        }
        personnelDraft = personnelDraft.filter((c) => c.id !== contactId);
        personnelDirty = true;
        render();
      }
      else if (action === "goReservation" || action === "reservation") {
        if (state.reservations === null || state.reservationVehicles === null) {
          state.loading = true;
          render();
          await ensureReservationsLoaded();
          state.loading = false;
        }
        goto("reservation");
      }
      else if (action === "reservationVehicle") {
        goto("reservationVehicle", vehicleId);
      }
      else if (action === "deleteReservation") {
        if (confirm("Supprimer définitivement cette réservation ?")) {
          try {
            await deleteReservationRemote(entryId);
            render();
          } catch (err) {
            state.error = "La suppression a échoué : " + err.message;
            render();
          }
        }
      }
      else if (action === "addReservationVehicle") {
        reservationVehiclesDraft.push({ id: uid(), name: "Nouveau véhicule", type: "" });
        reservationVehiclesDirty = true;
        render();
      }
      else if (action === "removeReservationVehicle") {
        reservationVehiclesDraft = reservationVehiclesDraft.filter((v) => v.id !== vehicleId);
        reservationVehiclesDirty = true;
        render();
      }
      else if (action === "resetContactCode") {
        const c = personnelDraft.find((c) => c.id === contactId);
        if (c && confirm(`Remettre le code de ${c.prenom || ""} ${c.nom || ""} à la valeur par défaut (1807) ? La personne devra en choisir un nouveau à sa prochaine connexion.`)) {
          c.newCode = "1807";
          personnelDirty = true;
          render();
        }
      }
      else if (action === "dashboard") goto("dashboard");
      else if (action === "detail") goto("detail", vehicleId);
      else if (action === "form") goto("form", vehicleId);
      else if (action === "config") { configDraft = null; configDirty = false; goto("config"); }
      else if (action === "historyList") {
        if (requireAdminOrAlert()) goto("historyList", vehicleId);
      }
      else if (action === "historyDetail") {
        if (requireAdminOrAlert()) goto("historyDetail", vehicleId, entryId);
      }
      else if (action === "deleteEntry") {
        if (confirm("Supprimer définitivement cette entrée de l'historique ?")) {
          await deleteEntryRemote(entryId);
          goto("historyList", vehicleId);
        }
      }
      else if (action === "setStatus") {
        formDraft.results[itemId] = el.dataset.status;
        render();
      }
      else if (action === "prevStep") {
        formDraft.step = Math.max(0, formDraft.step - 1);
        formDraft.touched = false;
        render();
      }
      else if (action === "toggleDetailShowAll") {
        state.detailShowAll = !state.detailShowAll;
        render();
      }
      else if (action === "toggleCollapse") {
        if (configCollapsed.has(vehicleId)) configCollapsed.delete(vehicleId);
        else configCollapsed.add(vehicleId);
        render();
      }
      else if (action === "expandAll") {
        configCollapsed.clear();
        render();
      }
      else if (action === "collapseAll") {
        configDraft.vehicles.forEach((v) => configCollapsed.add(v.id));
        render();
      }
      else if (action === "addVehicle") {
        configDraft.vehicles.push({ id: uid(), name: "Nouveau véhicule", type: "", groups: [], items: [], hidden: false, checkFrequencyDays: null });
        configDirty = true;
        render();
      }
      else if (action === "removeVehicle") {
        configDraft.vehicles = configDraft.vehicles.filter((v) => v.id !== vehicleId);
        configDirty = true;
        render();
      }
      else if (action === "duplicateVehicle") {
        const original = configDraft.vehicles.find((v) => v.id === vehicleId);
        const groupIdMap = new Map();
        const newGroups = original.groups.map((g) => {
          const newId = uid();
          groupIdMap.set(g.id, newId);
          return { id: newId, name: g.name };
        });
        const newItems = original.items.map((it) => ({
          id: uid(),
          name: it.name,
          groupId: it.groupId ? groupIdMap.get(it.groupId) || null : null,
        }));
        const copy = {
          id: uid(),
          name: original.name + " (copie)",
          type: original.type,
          hidden: original.hidden,
          checkFrequencyDays: original.checkFrequencyDays,
          groups: newGroups,
          items: newItems,
        };
        const i = configDraft.vehicles.findIndex((v) => v.id === vehicleId);
        configDraft.vehicles.splice(i + 1, 0, copy);
        configDirty = true;
        render();
      }
      else if (action === "moveVehicleUp") {
        const i = configDraft.vehicles.findIndex((v) => v.id === vehicleId);
        if (i > 0) {
          [configDraft.vehicles[i - 1], configDraft.vehicles[i]] = [configDraft.vehicles[i], configDraft.vehicles[i - 1]];
          configDirty = true;
          render();
        }
      }
      else if (action === "moveVehicleDown") {
        const i = configDraft.vehicles.findIndex((v) => v.id === vehicleId);
        if (i < configDraft.vehicles.length - 1) {
          [configDraft.vehicles[i + 1], configDraft.vehicles[i]] = [configDraft.vehicles[i], configDraft.vehicles[i + 1]];
          configDirty = true;
          render();
        }
      }
      else if (action === "addItem") {
        configDraft.vehicles.find((v) => v.id === vehicleId).items.push({ id: uid(), name: "", groupId: null });
        configDirty = true;
        render();
      }
      else if (action === "removeItem") {
        const v = configDraft.vehicles.find((v) => v.id === vehicleId);
        v.items = v.items.filter((i) => i.id !== itemId);
        configDirty = true;
        render();
      }
      else if (action === "addGroup") {
        configDraft.vehicles.find((v) => v.id === vehicleId).groups.push({ id: uid(), name: "Nouveau lieu" });
        configDirty = true;
        render();
      }
      else if (action === "removeGroup") {
        const v = configDraft.vehicles.find((v) => v.id === vehicleId);
        const groupId = el.dataset.group;
        v.groups = v.groups.filter((g) => g.id !== groupId);
        v.items.forEach((it) => { if (it.groupId === groupId) it.groupId = null; });
        configDirty = true;
        render();
      }
      else if (action === "moveGroupUp") {
        const v = configDraft.vehicles.find((v) => v.id === vehicleId);
        const groupId = el.dataset.group;
        const i = v.groups.findIndex((g) => g.id === groupId);
        if (i > 0) {
          [v.groups[i - 1], v.groups[i]] = [v.groups[i], v.groups[i - 1]];
          configDirty = true;
          render();
        }
      }
      else if (action === "moveGroupDown") {
        const v = configDraft.vehicles.find((v) => v.id === vehicleId);
        const groupId = el.dataset.group;
        const i = v.groups.findIndex((g) => g.id === groupId);
        if (i < v.groups.length - 1) {
          [v.groups[i + 1], v.groups[i]] = [v.groups[i], v.groups[i + 1]];
          configDirty = true;
          render();
        }
      }
    });
  });

  const notesInput = document.getElementById("notesInput");
  if (notesInput) {
    notesInput.addEventListener("input", (e) => { formDraft.notes = e.target.value; });
  }
  const validateStepBtn = document.getElementById("validateStepBtn");
  if (validateStepBtn) {
    validateStepBtn.addEventListener("click", async () => {
      const v = state.config.vehicles.find((x) => x.id === state.selectedVehicleId);
      const groups = groupItemsByLocation(v);
      const step = Math.min(formDraft.step, groups.length - 1);
      const current = groups[step];
      const isLast = step === groups.length - 1;

      formDraft.touched = true;
      const stepAnswered = current.items.every((it) => formDraft.results[it.id]);
      const nameOk = formDraft.checkedBy.trim().length > 0;
      if (!nameOk || !stepAnswered) { render(); return; }

      if (!isLast) {
        formDraft.step += 1;
        formDraft.touched = false;
        render();
        return;
      }

      formDraft.saving = true;
      render();
      try {
        const record = {
          vehicleId: v.id,
          checkedBy: formDraft.checkedBy.trim(),
          timestamp: new Date().toISOString(),
          results: formDraft.results,
          notes: formDraft.notes.trim(),
        };
        await submitInventoryRemote(record);

        const groupNameById = {};
        v.groups.forEach((g) => { groupNameById[g.id] = g.name; });
        const defects = v.items
          .filter((it) => record.results[it.id] && record.results[it.id] !== "ok")
          .map((it) => ({
            name: it.name,
            status: record.results[it.id],
            groupName: it.groupId ? groupNameById[it.groupId] || "" : "",
          }));

        if (defects.length) {
          state.recapVehicleId = v.id;
          state.recapDefects = defects;
          goto("recap", v.id);
        } else {
          goto("detail", v.id);
        }
      } catch (e) {
        state.error = "L'enregistrement a échoué : " + e.message;
        formDraft.saving = false;
        render();
      }
    });
  }

  app.querySelectorAll('[data-role="vehicleName"]').forEach((el) =>
    el.addEventListener("input", (e) => { configDraft.vehicles.find((v) => v.id === el.dataset.vehicle).name = e.target.value; configDirty = true; })
  );
  app.querySelectorAll('[data-role="vehicleType"]').forEach((el) =>
    el.addEventListener("input", (e) => { configDraft.vehicles.find((v) => v.id === el.dataset.vehicle).type = e.target.value; configDirty = true; })
  );
  app.querySelectorAll('[data-role="vehicleHidden"]').forEach((el) =>
    el.addEventListener("change", (e) => { configDraft.vehicles.find((v) => v.id === el.dataset.vehicle).hidden = e.target.checked; configDirty = true; render(); })
  );
  app.querySelectorAll('[data-role="vehicleFrequency"]').forEach((el) =>
    el.addEventListener("input", (e) => {
      const n = parseInt(e.target.value, 10);
      configDraft.vehicles.find((v) => v.id === el.dataset.vehicle).checkFrequencyDays = n > 0 ? n : null;
      configDirty = true;
    })
  );
  app.querySelectorAll('[data-role="itemName"]').forEach((el) =>
    el.addEventListener("input", (e) => {
      const v = configDraft.vehicles.find((v) => v.id === el.dataset.vehicle);
      v.items.find((i) => i.id === el.dataset.item).name = e.target.value;
      configDirty = true;
    })
  );
  app.querySelectorAll('[data-role="itemGroupSelect"]').forEach((el) =>
    el.addEventListener("change", (e) => {
      const v = configDraft.vehicles.find((v) => v.id === el.dataset.vehicle);
      v.items.find((i) => i.id === el.dataset.item).groupId = e.target.value || null;
      configDirty = true;
    })
  );
  app.querySelectorAll('[data-role="groupName"]').forEach((el) =>
    el.addEventListener("input", (e) => {
      const v = configDraft.vehicles.find((v) => v.id === el.dataset.vehicle);
      v.groups.find((g) => g.id === el.dataset.group).name = e.target.value;
      configDirty = true;
    })
  );

  const saveConfigBtn = document.getElementById("saveConfigBtn");
  if (saveConfigBtn) {
    saveConfigBtn.addEventListener("click", async () => {
      saveConfigBtn.disabled = true;
      saveConfigBtn.textContent = "Enregistrement…";
      try {
        await saveConfigRemote(configDraft);
        configDirty = false;
        goto("dashboard");
      } catch (e) {
        state.error = "Échec de l'enregistrement de la configuration : " + e.message;
        saveConfigBtn.disabled = false;
        saveConfigBtn.textContent = "Enregistrer les modifications";
        render();
      }
    });
  }

  const contactFields = [
    ["contactPrenom", "prenom"],
    ["contactNom", "nom"],
    ["contactGrade", "grade"],
    ["contactTelephone", "telephone"],
    ["contactEmail", "email"],
    ["contactNotes", "notes"],
    ["contactUsername", "username"],
    ["contactNewCode", "newCode"],
  ];
  contactFields.forEach(([role, field]) => {
    app.querySelectorAll(`[data-role="${role}"]`).forEach((el) =>
      el.addEventListener("input", (e) => {
        const c = personnelDraft.find((c) => c.id === el.dataset.contact);
        if (c) c[field] = e.target.value;
        personnelDirty = true;
      })
    );
  });
  app.querySelectorAll('[data-role="contactIsAdmin"]').forEach((el) =>
    el.addEventListener("change", (e) => {
      const c = personnelDraft.find((c) => c.id === el.dataset.contact);
      if (c) c.isAdmin = e.target.checked;
      personnelDirty = true;
    })
  );
  app.querySelectorAll('[data-role="contactCanViewDirectory"]').forEach((el) =>
    el.addEventListener("change", (e) => {
      const c = personnelDraft.find((c) => c.id === el.dataset.contact);
      if (c) c.canViewDirectory = e.target.checked;
      personnelDirty = true;
    })
  );

  const savePersonnelBtn = document.getElementById("savePersonnelBtn");
  if (savePersonnelBtn) {
    savePersonnelBtn.addEventListener("click", async () => {
      savePersonnelBtn.disabled = true;
      savePersonnelBtn.textContent = "Enregistrement…";
      try {
        const removedContacts = (state.personnel || []).filter(
          (orig) => !personnelDraft.find((c) => c.id === orig.id)
        );

        await ensureUsersLoaded();
        const users = (state.users || []).slice();
        let usersChanged = false;

        // 1. Comptes des contacts supprimés : supprimés en cascade.
        removedContacts.forEach((contact) => {
          let idx = -1;
          if (contact.userId) {
            idx = users.findIndex((u) => u.id === contact.userId);
          }
          if (idx === -1 && contact.prenom && contact.nom) {
            const expectedUsername = `${normalizeUsernamePart(contact.prenom)}.${normalizeUsernamePart(contact.nom)}`;
            idx = users.findIndex((u) => u.username === expectedUsername);
          }
          if (idx !== -1) {
            users.splice(idx, 1);
            usersChanged = true;
          }
        });

        // 2. Pour chaque contact restant : créer, synchroniser ou retirer son compte
        //    selon le grade (pas de compte pour "Autre") et les droits cochés.
        personnelDraft.forEach((contact) => {
          const isAutre = (contact.grade || "") === "Autre";

          if (isAutre) {
            if (contact.userId) {
              const idx = users.findIndex((u) => u.id === contact.userId);
              if (idx !== -1) {
                users.splice(idx, 1);
                usersChanged = true;
              }
              contact.userId = null;
              contact.username = "";
            }
            return;
          }

          const prenom = (contact.prenom || "").trim();
          const nom = (contact.nom || "").trim();
          if (!prenom || !nom) return; // pas assez d'info pour créer un compte

          let idx = contact.userId ? users.findIndex((u) => u.id === contact.userId) : -1;

          if (idx === -1) {
            const username = (contact.username || `${normalizeUsernamePart(prenom)}.${normalizeUsernamePart(nom)}`).trim();
            const newUser = {
              id: uid(),
              username,
              displayName: `${prenom} ${nom}`,
              isAdmin: !!contact.isAdmin,
              canViewDirectory: !!contact.canViewDirectory,
              newCode: "1807",
              mustChangeCode: true,
            };
            users.push(newUser);
            contact.userId = newUser.id;
            contact.username = username;
            usersChanged = true;
          } else {
            const u = users[idx];
            const username = (contact.username || u.username || "").trim() || u.username;
            u.username = username;
            u.displayName = `${prenom} ${nom}`;
            u.isAdmin = !!contact.isAdmin;
            u.canViewDirectory = !!contact.canViewDirectory;
            if (contact.newCode) {
              u.newCode = contact.newCode;
              u.mustChangeCode = true;
            }
            contact.username = username;
            usersChanged = true;
          }
          delete contact.newCode; // champ transitoire, ne se stocke pas sur le contact
        });

        await savePersonnelRemote(personnelDraft);
        if (usersChanged) {
          await saveUsersRemote(users);
          const me = users.find((u) => u.id === state.currentUser.id);
          if (me) {
            if (me.newCode) state.currentCode = me.newCode;
            state.currentUser = {
              id: me.id,
              username: me.username,
              displayName: me.displayName,
              isAdmin: !!me.isAdmin,
              canViewDirectory: !!me.canViewDirectory,
            };
            saveSession(me.username, state.currentCode);
          }
        }

        personnelDirty = false;
        goto("directory");
      } catch (e) {
        state.error = "Échec de l'enregistrement de l'annuaire : " + e.message;
        savePersonnelBtn.disabled = false;
        savePersonnelBtn.textContent = "Enregistrer les modifications";
        render();
      }
    });
  }

  const resaFieldMap = [
    ["resaNameInput", "personName"],
    ["resaStartDate", "startDate"],
    ["resaStartTime", "startTime"],
    ["resaEndDate", "endDate"],
    ["resaEndTime", "endTime"],
    ["resaMotifInput", "motif"],
  ];
  resaFieldMap.forEach(([id, field]) => {
    const el = document.getElementById(id);
    if (el) el.addEventListener("input", (e) => { reservationDraft[field] = e.target.value; });
  });

  const resaSubmitBtn = document.getElementById("resaSubmitBtn");
  if (resaSubmitBtn) {
    resaSubmitBtn.addEventListener("click", async () => {
      const v = (state.reservationVehicles || []).find((x) => x.id === state.selectedVehicleId);
      const d = reservationDraft;
      d.touched = true;
      const allFilled = d.personName.trim() && d.startDate && d.startTime && d.endDate && d.endTime;
      const validRange = allFilled && new Date(`${d.endDate}T${d.endTime}`) > new Date(`${d.startDate}T${d.startTime}`);
      if (!allFilled || !validRange) { render(); return; }

      const startISO = `${d.startDate}T${d.startTime}`;
      const endISO = `${d.endDate}T${d.endTime}`;

      d.saving = true;
      render();
      try {
        // Rafraîchit juste avant de vérifier, pour limiter le risque que deux
        // personnes réservent le même créneau en même temps sans le savoir.
        const fresh = await apiGet("getReservationData");
        state.reservations = fresh.reservations || [];
      } catch (e) {
        // si le rafraîchissement échoue, on continue avec les données déjà en mémoire
      }

      const conflict = findOverlap(v.id, startISO, endISO);
      if (conflict) {
        state.error = `Véhicule déjà réservé par ${conflict.personName} du ${formatResaDate(conflict.start)} au ${formatResaDate(conflict.end)}. Choisis un autre créneau.`;
        d.saving = false;
        render();
        return;
      }

      try {
        await addReservationRemote({
          vehicleId: v.id,
          personName: d.personName.trim(),
          start: startISO,
          end: endISO,
          motif: d.motif.trim(),
        });
        reservationDraft = { personName: (state.currentUser && state.currentUser.displayName) || "", startDate: "", startTime: "", endDate: "", endTime: "", motif: "", touched: false, saving: false };
        render();
      } catch (e) {
        state.error = "La réservation a échoué : " + e.message;
        d.saving = false;
        render();
      }
    });
  }

  app.querySelectorAll('[data-role="resaVehicleName"]').forEach((el) =>
    el.addEventListener("input", (e) => {
      const v = reservationVehiclesDraft.find((v) => v.id === el.dataset.vehicle);
      if (v) v.name = e.target.value;
      reservationVehiclesDirty = true;
    })
  );
  app.querySelectorAll('[data-role="resaVehicleType"]').forEach((el) =>
    el.addEventListener("input", (e) => {
      const v = reservationVehiclesDraft.find((v) => v.id === el.dataset.vehicle);
      if (v) v.type = e.target.value;
      reservationVehiclesDirty = true;
    })
  );

  const saveResaVehiclesBtn = document.getElementById("saveResaVehiclesBtn");
  if (saveResaVehiclesBtn) {
    saveResaVehiclesBtn.addEventListener("click", async () => {
      saveResaVehiclesBtn.disabled = true;
      saveResaVehiclesBtn.textContent = "Enregistrement…";
      try {
        await saveReservationVehiclesRemote(reservationVehiclesDraft);
        reservationVehiclesDirty = false;
        render();
      } catch (e) {
        state.error = "Échec de l'enregistrement des véhicules : " + e.message;
        saveResaVehiclesBtn.disabled = false;
        saveResaVehiclesBtn.textContent = "Enregistrer les véhicules";
        render();
      }
    });
  }
}

// ---------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------
async function boot() {
  const session = readSession();
  if (!session || !session.username || !session.code) {
    render();
    attachLoginHandlers();
    return;
  }
  state.loading = true;
  render();
  try {
    const user = await attemptLogin(session.username, session.code);
    if (user) {
      state.loading = false;
      if (user.mustChangeCode) {
        state._setupUsername = session.username;
        state._setupOldSecret = session.code;
        state._setupUser = user;
        goto("setup");
        return;
      }
      state.currentUser = user;
      state.currentCode = session.code;
      goto("home");
      await loadAll();
      return;
    }
  } catch (e) {
    // pas de connexion possible pour l'instant, on retombe sur l'écran de connexion
  }
  clearSession();
  state.loading = false;
  render();
  attachLoginHandlers();
}

boot();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {
      // installation reste possible sans service worker, simplement sans mise en cache
    });
  });
}
</script>
</body>
</html>
